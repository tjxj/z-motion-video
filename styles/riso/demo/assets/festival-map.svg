<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <pattern id="risoDotsBlue" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#0078BF" opacity="0.28"/>
    </pattern>
    <pattern id="risoDotsPink" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.8" fill="#FF48B0" opacity="0.34"/>
    </pattern>
    <pattern id="risoStripe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="16" fill="#FF48B0" opacity="0.32"/>
    </pattern>
  </defs>

  <!-- Recycled paper base -->
  <rect width="960" height="640" fill="#F3EEE3"/>
  <rect x="20" y="20" width="920" height="600" fill="none" stroke="#0078BF" stroke-width="4"/>
  <rect x="27" y="27" width="920" height="600" fill="none" stroke="#FF48B0" stroke-width="2.5" style="mix-blend-mode:multiply"/>

  <!-- Lawn halftone zone -->
  <path d="M44 130 Q300 95 540 135 T916 125 L916 588 L44 588 Z" fill="url(#risoDotsBlue)"/>
  <!-- Sound wave arcs from Main Stage -->
  <g style="mix-blend-mode:multiply" fill="none" stroke="#FF48B0" stroke-width="4" stroke-dasharray="12 10" opacity="0.75">
    <path d="M165 265 A120 120 0 0 1 350 265"/>
    <path d="M125 295 A168 168 0 0 1 390 295"/>
    <path d="M90 330 A212 212 0 0 1 428 330"/>
  </g>

  <!-- Walking Route (dashed blue + offset pink) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 250 C260 390, 440 420, 478 498" stroke="#FF48B0" stroke-width="8" stroke-dasharray="16 14" transform="translate(5,4)" style="mix-blend-mode:multiply"/>
    <path d="M258 250 C260 390, 440 420, 478 498" stroke="#0078BF" stroke-width="8" stroke-dasharray="16 14"/>
    <path d="M726 245 C720 355, 580 390, 478 498" stroke="#FF48B0" stroke-width="8" stroke-dasharray="16 14" transform="translate(5,4)" style="mix-blend-mode:multiply"/>
    <path d="M726 245 C720 355, 580 390, 478 498" stroke="#0078BF" stroke-width="8" stroke-dasharray="16 14"/>
    <path d="M258 250 C430 285, 560 285, 726 245" stroke="#FF48B0" stroke-width="6" stroke-dasharray="10 12" style="mix-blend-mode:multiply"/>
  </g>

  <!-- Header bar -->
  <rect x="44" y="42" width="335" height="52" fill="#0078BF"/>
  <rect x="50" y="47" width="335" height="52" fill="none" stroke="#FF48B0" stroke-width="3" style="mix-blend-mode:multiply"/>
  <text x="64" y="77" fill="#F3EEE3" font-family="sans-serif" font-weight="900" font-size="25" letter-spacing="2">SITE MAP · 场地图示例</text>

  <!-- Compass top right -->
  <g transform="translate(866, 72)">
    <circle r="30" fill="#F3EEE3" stroke="#0078BF" stroke-width="3.5"/>
    <circle cx="4" cy="3" r="30" fill="none" stroke="#FF48B0" stroke-width="2.5" style="mix-blend-mode:multiply"/>
    <polygon points="0,-22 8,6 0,0 -8,6" fill="#FF48B0"/>
    <polygon points="0,22 7,-2 0,4 -7,-2" fill="#0078BF" style="mix-blend-mode:multiply"/>
    <text x="0" y="-35" text-anchor="middle" fill="#1E155C" font-family="sans-serif" font-weight="900" font-size="16">N</text>
  </g>

  <!-- MAIN STAGE (Top Left) -->
  <g transform="translate(96, 132)">
    <rect x="8" y="8" width="320" height="122" fill="#FF48B0" style="mix-blend-mode:multiply"/>
    <rect x="0" y="0" width="320" height="122" fill="#F3EEE3" stroke="#0078BF" stroke-width="5"/>
    <rect x="0" y="0" width="320" height="42" fill="#0078BF"/>
    <text x="160" y="29" text-anchor="middle" fill="#F3EEE3" font-family="sans-serif" font-weight="900" font-size="22" letter-spacing="3">STAGE A · 主舞台</text>
    <!-- Speaker icons -->
    <rect x="20" y="56" width="36" height="50" fill="#0078BF"/>
    <circle cx="38" cy="70" r="7" fill="#F3EEE3"/>
    <circle cx="38" cy="91" r="10" fill="#FF48B0"/>
    <rect x="264" y="56" width="36" height="50" fill="#0078BF"/>
    <circle cx="282" cy="70" r="7" fill="#F3EEE3"/>
    <circle cx="282" cy="91" r="10" fill="#FF48B0"/>
    <text x="160" y="88" text-anchor="middle" fill="#1E155C" font-family="sans-serif" font-weight="900" font-size="26">户外草坪大舞台</text>
    <text x="160" y="110" text-anchor="middle" fill="#0078BF" font-family="sans-serif" font-weight="700" font-size="16">压轴时段提前 20 分钟占位</text>
  </g>

  <!-- LIVE STAGE (Top Right) -->
  <g transform="translate(576, 148)">
    <rect x="7" y="7" width="286" height="106" fill="#0078BF" opacity="0.88" style="mix-blend-mode:multiply"/>
    <rect x="0" y="0" width="286" height="106" fill="#F3EEE3" stroke="#FF48B0" stroke-width="5"/>
    <rect x="0" y="0" width="286" height="38" fill="#FF48B0"/>
    <text x="143" y="26" text-anchor="middle" fill="#F3EEE3" font-family="sans-serif" font-weight="900" font-size="20" letter-spacing="2">STAGE B · 副舞台</text>
    <text x="143" y="72" text-anchor="middle" fill="#1E155C" font-family="sans-serif" font-weight="900" font-size="24">独立新声舞台</text>
    <text x="143" y="95" text-anchor="middle" fill="#0078BF" font-family="sans-serif" font-weight="700" font-size="15">距主舞台步行约 8 分钟</text>
  </g>

  <!-- SUPPLY & MARKET (Middle Left) -->
  <g transform="translate(88, 368)">
    <rect x="6" y="6" width="218" height="84" fill="url(#risoStripe)"/>
    <rect x="0" y="0" width="218" height="84" fill="#F3EEE3" stroke="#0078BF" stroke-width="4"/>
    <circle cx="34" cy="42" r="18" fill="#0078BF"/>
    <text x="34" y="49" text-anchor="middle" fill="#F3EEE3" font-family="sans-serif" font-weight="900" font-size="20">W</text>
    <text x="64" y="38" fill="#1E155C" font-family="sans-serif" font-weight="900" font-size="22">饮水 · 餐饮区</text>
    <text x="64" y="64" fill="#0078BF" font-family="sans-serif" font-weight="700" font-size="16">洗手间 / 充电宝柜</text>
  </g>

  <!-- MEDICAL & REST (Middle Right) -->
  <g transform="translate(658, 368)">
    <rect x="6" y="6" width="218" height="84" fill="url(#risoDotsPink)"/>
    <rect x="0" y="0" width="218" height="84" fill="#F3EEE3" stroke="#FF48B0" stroke-width="4"/>
    <rect x="20" y="24" width="36" height="36" rx="6" fill="#FF48B0"/>
    <path d="M38 30 V54 M26 42 H50" stroke="#F3EEE3" stroke-width="6" stroke-linecap="round"/>
    <text x="68" y="38" fill="#1E155C" font-family="sans-serif" font-weight="900" font-size="22">医疗 · 遮阴区</text>
    <text x="68" y="64" fill="#0078BF" font-family="sans-serif" font-weight="700" font-size="16">中暑 / 扭伤求助点</text>
  </g>

  <!-- MEETING POINT STARBURST (Bottom Center) -->
  <g transform="translate(478, 505)">
    <!-- Starburst behind -->
    <polygon points="0,-64 14,-28 50,-42 32,-10 66,8 28,18 40,54 8,32 -14,62 -18,24 -54,34 -30,4 -64,-16 -24,-22 -34,-58 -4,-30" fill="#FF48B0" opacity="0.9"/>
    <circle cx="5" cy="4" r="34" fill="#0078BF" opacity="0.86" style="mix-blend-mode:multiply"/>
    <circle cx="0" cy="0" r="24" fill="#F3EEE3" stroke="#1E155C" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="#FF48B0"/>
    <rect x="-132" y="36" width="264" height="46" fill="#1E155C"/>
    <text x="0" y="66" text-anchor="middle" fill="#F3EEE3" font-family="sans-serif" font-weight="900" font-size="22">★ 出口大标志 · 约定集合点</text>
  </g>

  <!-- Distance callout badge -->
  <g transform="translate(480, 268)">
    <rect x="-86" y="-22" width="172" height="44" rx="22" fill="#F3EEE3" stroke="#0078BF" stroke-width="3.5"/>
    <text x="0" y="7" text-anchor="middle" fill="#1E155C" font-family="sans-serif" font-weight="900" font-size="20">赶场步行 ~8 min</text>
  </g>
</svg>
