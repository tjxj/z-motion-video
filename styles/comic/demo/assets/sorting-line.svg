<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <pattern id="dotsBlue" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#3FA9F5" fill-opacity="0.22"/>
    </pattern>
    <pattern id="dotsYellow" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#E09B00" fill-opacity="0.22"/>
    </pattern>
    <pattern id="beltStripe" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="28" height="28" fill="#2A2D34"/>
      <rect width="12" height="28" fill="#3E434E"/>
    </pattern>
  </defs>

  <!-- 漫画底板 -->
  <rect width="900" height="540" fill="#FFFDF5"/>
  <rect width="900" height="270" fill="url(#dotsBlue)"/>
  <rect y="270" width="900" height="270" fill="#F4EFE0"/>

  <!-- 背景速度线 -->
  <g stroke="#111" stroke-width="3" stroke-linecap="round" opacity="0.16">
    <line x1="30" y1="68" x2="220" y2="68"/>
    <line x1="80" y1="102" x2="290" y2="102"/>
    <line x1="600" y1="74" x2="860" y2="74"/>
    <line x1="650" y1="112" x2="840" y2="112"/>
    <line x1="40" y1="186" x2="180" y2="186"/>
  </g>

  <!-- 顶部悬吊自动扫码龙门架 -->
  <g stroke="#111" stroke-width="5" stroke-linejoin="round">
    <rect x="360" y="0" width="28" height="90" fill="#3FA9F5"/>
    <rect x="512" y="0" width="28" height="90" fill="#3FA9F5"/>
    <rect x="330" y="72" width="240" height="56" rx="12" fill="#FFD23F"/>
    <rect x="415" y="128" width="70" height="20" rx="4" fill="#111"/>
    <!-- 指示灯 -->
    <circle cx="362" cy="100" r="9" fill="#F2545B"/>
    <circle cx="390" cy="100" r="9" fill="#4CD964"/>
    <text x="466" y="108" font-family="sans-serif" font-weight="900" font-size="22" fill="#111" stroke="none" text-anchor="middle">SCANNER</text>
  </g>

  <!-- 红色激光扫描扇形 -->
  <polygon points="432,148 468,148 530,300 370,300" fill="#F2545B" fill-opacity="0.28"/>
  <line x1="395" y1="278" x2="505" y2="278" stroke="#F2545B" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- 右侧分流出口牌：A区 / B区 / C区 -->
  <g stroke="#111" stroke-width="4.5" stroke-linejoin="round">
    <!-- 滑槽 B -->
    <path d="M620 265 L865 210 L865 268 L620 318 Z" fill="#D9ECFF"/>
    <rect x="752" y="156" width="112" height="44" rx="8" fill="#3FA9F5"/>
    <text x="808" y="186" font-family="sans-serif" font-weight="900" font-size="22" fill="#FFF" stroke="none" text-anchor="middle">A 区 · 北</text>

    <!-- 滑槽 C -->
    <path d="M645 368 L865 395 L865 452 L645 418 Z" fill="#FFE6E8"/>
    <rect x="752" y="458" width="112" height="44" rx="8" fill="#F2545B"/>
    <text x="808" y="488" font-family="sans-serif" font-weight="900" font-size="22" fill="#FFF" stroke="none" text-anchor="middle">B 区 · 南</text>
  </g>

  <!-- 主传送带 -->
  <g stroke="#111" stroke-width="5" stroke-linejoin="round">
    <!-- 支架腿 -->
    <rect x="115" y="410" width="24" height="130" fill="#555A66"/>
    <rect x="395" y="410" width="24" height="130" fill="#555A66"/>
    <rect x="655" y="410" width="24" height="130" fill="#555A66"/>
    <!-- 传送带本体 -->
    <rect x="34" y="346" width="720" height="72" rx="36" fill="url(#beltStripe)"/>
    <!-- 传送带滚轮 -->
    <circle cx="84" cy="382" r="20" fill="#FFD23F"/>
    <circle cx="84" cy="382" r="6" fill="#111"/>
    <circle cx="240" cy="382" r="18" fill="#FFF"/>
    <circle cx="395" cy="382" r="18" fill="#FFF"/>
    <circle cx="550" cy="382" r="18" fill="#FFF"/>
    <circle cx="704" cy="382" r="20" fill="#FFD23F"/>
    <circle cx="704" cy="382" r="6" fill="#111"/>
    <!-- 传送方向箭头 -->
    <path d="M135 382 H195 M180 368 L197 382 L180 396" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linecap="round"/>
    <path d="M295 382 H355 M340 368 L357 382 L340 396" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linecap="round"/>
    <path d="M595 382 H655 M640 368 L657 382 L640 396" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 左侧排队的小包裹 -->
  <g transform="translate(115, 232) rotate(-3)" stroke="#111" stroke-width="5" stroke-linejoin="round">
    <rect x="0" y="20" width="112" height="94" rx="8" fill="#E9B872"/>
    <path d="M0 20 L18 0 L94 0 L112 20 Z" fill="#F5CE8F"/>
    <rect x="44" y="20" width="24" height="36" fill="#FFFDF5" opacity="0.75"/>
    <!-- 小面单 -->
    <rect x="14" y="42" width="32" height="24" rx="3" fill="#FFF" stroke-width="3"/>
    <line x1="19" y1="50" x2="41" y2="50" stroke-width="2.5"/>
    <line x1="19" y1="58" x2="36" y2="58" stroke-width="2.5"/>
    <!-- 好奇眼神 -->
    <circle cx="64" cy="78" r="5" fill="#111"/>
    <circle cx="88" cy="78" r="5" fill="#111"/>
    <path d="M72 90 Q76 94 80 90" fill="none" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- 主角「小箱」正在扫码区疾驰 -->
  <g transform="translate(375, 198) rotate(3)" stroke="#111" stroke-width="5.5" stroke-linejoin="round">
    <!-- 冲刺小速度线 -->
    <path d="M-46 58 H-12 M-58 88 H-16 M-38 116 H-14" stroke="#3FA9F5" stroke-width="5" stroke-linecap="round"/>
    <!-- 展开的纸箱折耳 -->
    <path d="M4 26 L-22 2 L38 -4 L54 26 Z" fill="#F4C77B"/>
    <path d="M142 26 L168 0 L108 -6 L92 26 Z" fill="#F4C77B"/>
    <!-- 箱身 -->
    <rect x="4" y="26" width="138" height="120" rx="12" fill="#E5A852"/>
    <rect x="4" y="26" width="138" height="120" rx="12" fill="url(#dotsYellow)"/>
    <!-- 胶带条 -->
    <rect x="57" y="26" width="32" height="44" fill="#FFD23F"/>
    <!-- 条码面单 -->
    <rect x="16" y="40" width="34" height="44" rx="4" fill="#FFF" stroke-width="3.5"/>
    <g stroke="#111" stroke-width="2.5">
      <line x1="22" y1="49" x2="44" y2="49"/>
      <line x1="22" y1="57" x2="44" y2="57"/>
      <line x1="22" y1="65" x2="36" y2="65"/>
      <line x1="22" y1="73" x2="44" y2="73"/>
    </g>
    <!-- 兴奋大眼睛 -->
    <ellipse cx="64" cy="96" rx="11" ry="13" fill="#FFF"/>
    <circle cx="67" cy="96" r="5.5" fill="#111"/>
    <circle cx="69" cy="92" r="2.2" fill="#FFF" stroke="none"/>
    <ellipse cx="106" cy="96" rx="11" ry="13" fill="#FFF"/>
    <circle cx="109" cy="96" r="5.5" fill="#111"/>
    <circle cx="111" cy="92" r="2.2" fill="#FFF" stroke="none"/>
    <!-- 腮红 -->
    <ellipse cx="47" cy="110" rx="7" ry="4" fill="#F2545B" stroke="none" opacity="0.65"/>
    <ellipse cx="122" cy="110" rx="7" ry="4" fill="#F2545B" stroke="none" opacity="0.65"/>
    <!-- 开心大嘴 -->
    <path d="M74 114 Q86 128 98 114 Z" fill="#F2545B" stroke-width="4"/>
    <!-- 挥舞的小手 -->
    <path d="M142 84 Q168 72 172 52" fill="none" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="172" cy="50" r="8" fill="#FFD23F"/>
  </g>

  <!-- 拟声字爆炸贴片：BEEP! -->
  <g transform="translate(612, 82) rotate(-8)">
    <polygon points="0,-54 19,-26 54,-38 38,-10 72,6 34,20 44,52 10,32 -16,56 -20,22 -58,20 -30,-4 -50,-36 -14,-24"
             fill="#F2545B" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <text x="4" y="11" font-family="Impact, sans-serif" font-weight="900" font-size="34" fill="#FFD23F"
          stroke="#111" stroke-width="6" paint-order="stroke" text-anchor="middle" letter-spacing="2">BEEP!</text>
  </g>

  <!-- 左上黄色漫画旁白角签 -->
  <g transform="translate(26, 22)">
    <rect x="5" y="5" width="236" height="48" fill="#111"/>
    <rect x="0" y="0" width="236" height="48" fill="#FFD23F" stroke="#111" stroke-width="4.5"/>
    <text x="118" y="32" font-family="sans-serif" font-weight="900" font-size="23" fill="#111" text-anchor="middle">自动分拣线 · 全速识别</text>
  </g>
</svg>
