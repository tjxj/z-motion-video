  <g transform="translate(230, 326)">
    <!-- Funnel & mast -->
    <rect x="196" y="10" width="28" height="36" rx="4" fill="#E05263"/>
    <rect x="196" y="18" width="28" height="8" fill="#FFFDF8"/>
    <line x1="154" y1="6" x2="154" y2="44" stroke="#3A4A58" stroke-width="4" stroke-linecap="round"/>
    <path d="M154 10 L178 16 L154 22 Z" fill="#FFE27A"/>
    <!-- Upper deck -->
    <path d="M98 44 L296 44 L310 82 L88 82 Z" fill="#FFFDF8" stroke="#3A4A58" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Upper windows -->
    <g fill="#5FA9D0">
      <rect x="114" y="54" width="28" height="18" rx="4"/>
      <rect x="150" y="54" width="28" height="18" rx="4"/>
      <rect x="186" y="54" width="28" height="18" rx="4"/>
      <rect x="222" y="54" width="28" height="18" rx="4"/>
      <rect x="258" y="54" width="28" height="18" rx="4"/>
    </g>
    <!-- Main deck cabin -->
    <path d="M52 82 L346 82 L364 118 L42 118 Z" fill="#FFFDF8" stroke="#3A4A58" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="52" y="82" width="298" height="9" fill="#9CCBEB"/>
    <!-- Main windows -->
    <g fill="#4282A8">
      <rect x="74" y="96" width="24" height="15" rx="3"/>
      <rect x="108" y="96" width="24" height="15" rx="3"/>
      <rect x="142" y="96" width="24" height="15" rx="3"/>
      <rect x="176" y="96" width="24" height="15" rx="3"/>
      <rect x="210" y="96" width="24" height="15" rx="3"/>
      <rect x="244" y="96" width="24" height="15" rx="3"/>
      <rect x="278" y="96" width="24" height="15" rx="3"/>
      <rect x="312" y="96" width="24" height="15" rx="3"/>
    </g>
    <!-- Hull -->
    <path d="M18 118 L392 118 L368 156 L42 156 Z" fill="#3B6E96" stroke="#2D4A63" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M26 130 L384 130" stroke="#F6B8C6" stroke-width="6"/>
    <!-- Life rings -->
    <circle cx="90" cy="130" r="9" fill="none" stroke="#FFFDF8" stroke-width="4"/>
    <circle cx="90" cy="130" r="9" fill="none" stroke="#E05263" stroke-width="4" stroke-dasharray="7 7"/>
    <circle cx="318" cy="130" r="9" fill="none" stroke="#FFFDF8" stroke-width="4"/>
    <circle cx="318" cy="130" r="9" fill="none" stroke="#E05263" stroke-width="4" stroke-dasharray="7 7"/>
    <!-- Portholes -->
    <circle cx="152" cy="142" r="5" fill="#FFE27A"/>
    <circle cx="192" cy="142" r="5" fill="#FFE27A"/>
    <circle cx="232" cy="142" r="5" fill="#FFE27A"/>
    <circle cx="272" cy="142" r="5" fill="#FFE27A"/>
  </g>
  <!-- Seagulls -->
  <g stroke="#FFFDF8" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M148 196 Q162 180 176 196 Q190 180 204 196"/>
    <path d="M236 226 Q246 214 256 226 Q266 214 276 226" stroke-width="3.5"/>
    <path d="M514 166 Q528 150 542 166 Q556 150 570 166"/>
  </g>
</svg>
