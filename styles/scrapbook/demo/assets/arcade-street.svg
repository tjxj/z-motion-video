<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B5E0F5"/>
      <stop offset="100%" stop-color="#FBF3E2"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DE755E"/>
      <stop offset="100%" stop-color="#C65C47"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky2)"/>
  <!-- Sunlit clouds -->
  <path d="M510 92 C510 74 528 64 546 68 C558 50 590 50 604 68 C622 66 638 78 636 92 Z" fill="#FFFDF8" opacity="0.9"/>
  <!-- Cobblestone Lane -->
  <polygon points="0,470 800,470 800,600 0,600" fill="#E8DCC8"/>
  <polygon points="180,470 610,470 760,600 50,600" fill="#DFD0B7"/>
  <!-- Cobblestone lines -->
  <g stroke="#C6B499" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="250" y1="504" x2="360" y2="504"/>
    <line x1="410" y1="504" x2="540" y2="504"/>
    <line x1="170" y1="538" x2="310" y2="538"/>
    <line x1="360" y1="538" x2="510" y2="538"/>
    <line x1="560" y1="538" x2="660" y2="538"/>
    <line x1="120" y1="572" x2="290" y2="572"/>
    <line x1="340" y1="572" x2="560" y2="572"/>
  </g>
  <!-- Left Cream Arcade Building (Qilou) -->
  <g>
    <rect x="34" y="138" width="276" height="342" fill="#F8EBCE" stroke="#57473C" stroke-width="3.5"/>
    <!-- Decorative gable -->
    <path d="M34 138 Q172 78 310 138 Z" fill="#EFE0BE" stroke="#57473C" stroke-width="3.5"/>
    <circle cx="172" cy="118" r="14" fill="#A8DCC8" stroke="#57473C" stroke-width="3"/>
    <!-- Upper balcony & louvered windows -->
    <rect x="64" y="176" width="60" height="86" rx="30" fill="#4E8375" stroke="#57473C" stroke-width="3"/>
    <rect x="144" y="176" width="60" height="86" rx="30" fill="#4E8375" stroke="#57473C" stroke-width="3"/>
    <rect x="224" y="176" width="60" height="86" rx="30" fill="#4E8375" stroke="#57473C" stroke-width="3"/>
    <g stroke="#7CB3A3" stroke-width="3">
      <line x1="74" y1="205" x2="114" y2="205"/><line x1="74" y1="222" x2="114" y2="222"/><line x1="74" y1="239" x2="114" y2="239"/>
      <line x1="154" y1="205" x2="194" y2="205"/><line x1="154" y1="222" x2="194" y2="222"/><line x1="154" y1="239" x2="194" y2="239"/>
      <line x1="234" y1="205" x2="274" y2="205"/><line x1="234" y1="222" x2="274" y2="222"/><line x1="234" y1="239" x2="274" y2="239"/>
    </g>
    <!-- Balcony balustrade -->
    <rect x="44" y="264" width="256" height="22" fill="#FFFDF8" stroke="#57473C" stroke-width="3"/>
    <!-- Ground floor arcade arches -->
    <path d="M58 480 L58 370 A42 42 0 0 1 142 370 L142 480 Z" fill="#C9B08E" stroke="#57473C" stroke-width="3.5"/>
    <path d="M174 480 L174 370 A42 42 0 0 1 258 370 L258 480 Z" fill="#C9B08E" stroke="#57473C" stroke-width="3.5"/>
    <!-- Cozy coffee signboard -->
    <rect x="78" y="392" width="44" height="58" rx="4" fill="#FFFDF8" stroke="#57473C" stroke-width="2.5"/>
    <circle cx="100" cy="418" r="10" fill="#FFE27A"/>
  </g>
  <!-- Right Red-Brick Minnan Villa -->
  <g>
    <rect x="430" y="164" width="328" height="316" fill="url(#brick)" stroke="#57473C" stroke-width="3.5"/>
    <!-- Terracotta Roof -->
    <polygon points="412,168 594,96 776,168" fill="#B54938" stroke="#57473C" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Cream pilasters & cornice -->
    <rect x="430" y="164" width="328" height="18" fill="#FBF3E0" stroke="#57473C" stroke-width="3"/>
    <rect x="430" y="304" width="328" height="16" fill="#FBF3E0" stroke="#57473C" stroke-width="3"/>
    <!-- Arched windows -->
    <path d="M472 288 L472 224 A28 28 0 0 1 528 224 L528 288 Z" fill="#FFF6E5" stroke="#57473C" stroke-width="3"/>
    <path d="M566 288 L566 224 A28 28 0 0 1 622 224 L622 288 Z" fill="#FFF6E5" stroke="#57473C" stroke-width="3"/>
    <path d="M660 288 L660 224 A28 28 0 0 1 716 224 L716 288 Z" fill="#FFF6E5" stroke="#57473C" stroke-width="3"/>
    <!-- Window grids -->
    <g stroke="#57473C" stroke-width="2.5">
      <line x1="500" y1="196" x2="500" y2="288"/><line x1="472" y1="242" x2="528" y2="242"/>
      <line x1="594" y1="196" x2="594" y2="288"/><line x1="566" y1="242" x2="622" y2="242"/>
      <line x1="688" y1="196" x2="688" y2="288"/><line x1="660" y1="242" x2="716" y2="242"/>
    </g>
    <!-- Red brick garden wall & arched gate -->
    <rect x="336" y="356" width="136" height="124" fill="#D56C56" stroke="#57473C" stroke-width="3.5"/>
    <rect x="330" y="346" width="148" height="16" rx="4" fill="#FBF3E0" stroke="#57473C" stroke-width="3"/>
    <path d="M542 480 L542 384 A44 44 0 0 1 630 384 L630 480 Z" fill="#538273" stroke="#57473C" stroke-width="3.5"/>
    <line x1="586" y1="340" x2="586" y2="480" stroke="#FBF3E0" stroke-width="3"/>
  </g>
  <!-- Cascading Bougainvillea (三角梅) -->
  <g>
    <!-- Green foliage -->
    <circle cx="348" cy="322" r="44" fill="#5D9E7A"/>
    <circle cx="404" cy="306" r="50" fill="#4D8E6B"/>
    <circle cx="468" cy="324" r="42" fill="#5D9E7A"/>
    <circle cx="316" cy="356" r="32" fill="#6BB08A"/>
    <circle cx="436" cy="350" r="34" fill="#6BB08A"/>
    <!-- Magenta blossoms -->
    <g fill="#E84B78">
      <circle cx="332" cy="306" r="16"/><circle cx="364" cy="294" r="18"/>
      <circle cx="394" cy="284" r="20"/><circle cx="432" cy="296" r="18"/>
      <circle cx="468" cy="308" r="17"/><circle cx="312" cy="340" r="14"/>
      <circle cx="356" cy="336" r="16"/><circle cx="412" cy="334" r="18"/>
      <circle cx="454" cy="346" r="15"/><circle cx="384" cy="360" r="13"/>
    </g>
    <g fill="#FF89AB">
      <circle cx="342" cy="300" r="8"/><circle cx="398" cy="278" r="9"/>
      <circle cx="438" cy="292" r="8"/><circle cx="362" cy="330" r="7"/>
      <circle cx="418" cy="328" r="8"/><circle cx="466" cy="304" r="7"/>
    </g>
  </g>
  <!-- Mint Vintage Bicycle parked by wall -->
  <g transform="translate(260, 444)" stroke="#3A3A3A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="56" r="24" fill="#FFFDF8" fill-opacity="0.35"/>
    <circle cx="110" cy="56" r="24" fill="#FFFDF8" fill-opacity="0.35"/>
    <path d="M24 56 L58 56 L86 24 L42 24 Z" stroke="#5FB89A" stroke-width="5"/>
    <line x1="86" y1="24" x2="110" y2="56" stroke="#5FB89A" stroke-width="5"/>
    <line x1="42" y1="24" x2="36" y2="12" stroke="#5FB89A" stroke-width="4.5"/>
    <line x1="26" y1="12" x2="46" y2="12" stroke="#8C5B3C" stroke-width="6"/>
    <path d="M86 24 L82 10 L96 8" stroke="#57473C" stroke-width="4"/>
    <!-- Woven front basket -->
    <rect x="92" y="14" width="24" height="18" rx="3" fill="#E8C284" stroke="#8C5B3C" stroke-width="3"/>
  </g>
  <!-- Vintage Streetlamp -->
  <g stroke="#443C36" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="692" y1="528" x2="692" y2="278"/>
    <path d="M692 288 Q692 252 652 256"/>
    <polygon points="638,256 666,256 660,282 644,282" fill="#FFE898" stroke="#443C36" stroke-width="3.5"/>
  </g>
</svg>
