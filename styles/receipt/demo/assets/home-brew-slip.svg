<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <rect width="800" height="460" fill="#F4F3ED"/>
  <!-- Subtle thermal dot grid -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#2B2B2B" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="800" height="460" fill="url(#dots)"/>
  <!-- Outer dashed receipt frame -->
  <rect x="20" y="20" width="760" height="420" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-dasharray="8 6" opacity="0.45"/>

  <!-- Header label -->
  <rect x="44" y="40" width="276" height="32" fill="#2B2B2B"/>
  <text x="58" y="62" font-family="Courier Prime, monospace" font-size="18" font-weight="700" fill="#FAFAF7" letter-spacing="2">HOME BREW · 1 CUP</text>
  <text x="756" y="62" text-anchor="end" font-family="Courier Prime, monospace" font-size="17" font-weight="700" fill="#666660">EST. COST ~5 CNY</text>
  <line x1="44" y1="86" x2="756" y2="86" stroke="#2B2B2B" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.4"/>

  <!-- Left: Pour-over dripper + carafe technical line illustration -->
  <g transform="translate(86, 112)">
    <!-- Steam waves -->
    <path d="M98 16 Q90 4 98 -8 Q106 -18 98 -28" fill="none" stroke="#666660" stroke-width="2.5" stroke-linecap="round" opacity="0.7" transform="translate(0,22)"/>
    <path d="M124 18 Q116 6 124 -6 Q132 -16 124 -26" fill="none" stroke="#666660" stroke-width="2.5" stroke-linecap="round" opacity="0.7" transform="translate(0,22)"/>
    <path d="M150 16 Q142 4 150 -8 Q158 -18 150 -28" fill="none" stroke="#666660" stroke-width="2.5" stroke-linecap="round" opacity="0.7" transform="translate(0,22)"/>

    <!-- V60 Filter cone -->
    <polygon points="56,52 192,52 140,136 108,136" fill="#FAFAF7" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Filter paper ridge lines -->
    <line x1="78" y1="52" x2="114" y2="136" stroke="#2B2B2B" stroke-width="1.5" opacity="0.28"/>
    <line x1="124" y1="52" x2="124" y2="136" stroke="#2B2B2B" stroke-width="1.5" opacity="0.28"/>
    <line x1="170" y1="52" x2="134" y2="136" stroke="#2B2B2B" stroke-width="1.5" opacity="0.28"/>
    <!-- Coffee grounds bed -->
    <polygon points="86,100 162,100 140,136 108,136" fill="#2B2B2B" opacity="0.82"/>
    <!-- Dripper collar -->
    <rect x="64" y="136" width="120" height="12" rx="3" fill="#2B2B2B"/>
    <!-- Dripper handle -->
    <path d="M180,68 C210,68 210,122 162,126" fill="none" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Coffee drop -->
    <path d="M124,158 C124,158 131,170 131,175 A7,7 0 1,1 117,175 C117,170 124,158 124,158 Z" fill="#E0402F"/>

    <!-- Glass server / mug -->
    <path d="M68,154 L180,154 L196,264 C198,278 188,288 174,288 L74,288 C60,288 50,278 52,264 Z" fill="#FAFAF7" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Brewed liquid fill -->
    <path d="M60,210 L188,210 L195,264 C197,276 187,286 174,286 L74,286 C61,286 51,276 53,264 Z" fill="#2B2B2B" opacity="0.16"/>
    <line x1="60" y1="210" x2="188" y2="210" stroke="#2B2B2B" stroke-width="2.5"/>
    <!-- Measurement ticks on server -->
    <line x1="82" y1="196" x2="96" y2="196" stroke="#2B2B2B" stroke-width="2"/>
    <line x1="82" y1="224" x2="104" y2="224" stroke="#2B2B2B" stroke-width="2"/>
    <line x1="82" y1="252" x2="96" y2="252" stroke="#2B2B2B" stroke-width="2"/>
    <text x="110" y="230" font-family="Courier Prime, monospace" font-size="14" font-weight="700" fill="#2B2B2B">250ml</text>
    <!-- Server handle -->
    <path d="M184,174 C222,174 222,250 192,254" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Right: Cost breakdown receipt blocks -->
  <g transform="translate(380, 114)">
    <!-- Item 1: Beans -->
    <rect x="0" y="0" width="376" height="76" fill="#FAFAF7" stroke="#2B2B2B" stroke-width="2"/>
    <circle cx="38" cy="38" r="18" fill="none" stroke="#2B2B2B" stroke-width="2.5"/>
    <path d="M31,24 C39,34 37,42 45,52" fill="none" stroke="#2B2B2B" stroke-width="2.2"/>
    <text x="72" y="34" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#2B2B2B">咖啡豆 15g</text>
    <text x="72" y="59" font-family="Courier Prime, monospace" font-size="15" fill="#666660">BEANS · SAMPLE</text>
    <text x="356" y="45" text-anchor="end" font-family="Courier Prime, monospace" font-size="26" font-weight="700" fill="#2B2B2B">¥3.80</text>

    <!-- Item 2: Filter & Water -->
    <rect x="0" y="92" width="376" height="76" fill="#FAFAF7" stroke="#2B2B2B" stroke-width="2"/>
    <polygon points="24,116 52,116 42,146 34,146" fill="none" stroke="#2B2B2B" stroke-width="2.5"/>
    <text x="72" y="126" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#2B2B2B">滤纸 + 水电</text>
    <text x="72" y="151" font-family="Courier Prime, monospace" font-size="15" fill="#666660">FILTER &amp; POWER</text>
    <text x="356" y="137" text-anchor="end" font-family="Courier Prime, monospace" font-size="26" font-weight="700" fill="#2B2B2B">¥1.20</text>

    <!-- Divider -->
    <line x1="0" y1="190" x2="376" y2="190" stroke="#2B2B2B" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="0" y1="196" x2="376" y2="196" stroke="#2B2B2B" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Total Highlight Box -->
    <rect x="0" y="212" width="376" height="86" fill="#FFF06A" stroke="#2B2B2B" stroke-width="2.5"/>
    <text x="22" y="246" font-family="Courier Prime, monospace" font-size="16" font-weight="700" fill="#2B2B2B" letter-spacing="1">TOTAL / CUP</text>
    <text x="22" y="278" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#2B2B2B">单杯自冲示例合计</text>
    <text x="352" y="270" text-anchor="end" font-family="Courier Prime, monospace" font-size="42" font-weight="700" fill="#E0402F">¥5.00</text>
    <!-- Red hand-drawn oval around ¥5.00 -->
    <ellipse cx="290" cy="256" rx="76" ry="30" fill="none" stroke="#E0402F" stroke-width="3" transform="rotate(-3 290 256)"/>
  </g>
</svg>
