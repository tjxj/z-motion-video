<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2B5E9E" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- 纸片底与方格 -->
  <rect width="880" height="540" fill="#FCF9F2"/>
  <rect width="880" height="540" fill="url(#g)"/>
  <rect x="14" y="14" width="852" height="512" fill="none" stroke="#1D1B18" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- 顶部手写图题 -->
  <text x="42" y="56" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="24" font-weight="700" fill="#1D1B18">Fig. 1  阳光穿过大气层的散射笔记</text>
  <path d="M 40 66 Q 210 62 392 67" fill="none" stroke="#D7372F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 左侧太阳（手绘线稿） -->
  <g transform="translate(108, 255)">
    <circle cx="0" cy="0" r="42" fill="#F7D97E" fill-opacity="0.55" stroke="#1D1B18" stroke-width="3"/>
    <circle cx="0" cy="0" r="37" fill="none" stroke="#D7372F" stroke-width="1.8" stroke-dasharray="6 5"/>
    <g stroke="#1D1B18" stroke-width="2.6" stroke-linecap="round">
      <line x1="0" y1="-56" x2="0" y2="-70"/>
      <line x1="0" y1="56" x2="0" y2="70"/>
      <line x1="-56" y1="0" x2="-70" y2="0"/>
      <line x1="56" y1="0" x2="70" y2="0"/>
      <line x1="-40" y1="-40" x2="-50" y2="-50"/>
      <line x1="40" y1="-40" x2="50" y2="-50"/>
      <line x1="-40" y1="40" x2="-50" y2="50"/>
      <line x1="40" y1="40" x2="50" y2="50"/>
    </g>
    <text x="0" y="7" text-anchor="middle" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="22" font-weight="700" fill="#1D1B18">阳光</text>
    <text x="0" y="96" text-anchor="middle" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="18" fill="#534D44">混合白光</text>
  </g>

  <!-- 大气层弧带 -->
  <path d="M 355 82 Q 315 270 355 475 L 688 475 Q 648 270 688 82 Z" fill="#2B5E9E" fill-opacity="0.08" stroke="#2B5E9E" stroke-width="2.2" stroke-dasharray="9 6"/>
  <text x="518" y="114" text-anchor="middle" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="21" font-weight="700" fill="#2B5E9E">大气层（空气分子）</text>

  <!-- 空气分子小点 -->
  <g fill="#FCF9F2" stroke="#2B5E9E" stroke-width="2.5">
    <circle cx="430" cy="185" r="9"/>
    <circle cx="520" cy="215" r="11"/>
    <circle cx="590" cy="165" r="8"/>
    <circle cx="465" cy="295" r="10"/>
    <circle cx="575" cy="275" r="9"/>
    <circle cx="620" cy="340" r="8"/>
    <circle cx="485" cy="395" r="9"/>
  </g>

  <!-- 红光长波：直接穿过 -->
  <path d="M 185 330 Q 220 302 255 330 T 325 330 T 395 330 T 465 330 T 535 330 T 605 330 T 675 330 L 745 330" fill="none" stroke="#D7372F" stroke-width="4" stroke-linecap="round"/>
  <path d="M 730 318 L 750 330 L 730 342" fill="none" stroke="#D7372F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="255" y="378" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="20" font-weight="700" fill="#D7372F">红光（波长较长 ~650nm）</text>
  <text x="720" y="374" text-anchor="middle" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="19" fill="#D7372F">较容易直穿</text>

  <!-- 蓝光短波：撞上空气分子后四面散射 -->
  <path d="M 185 215 Q 202 194 219 215 T 253 215 T 287 215 T 321 215 T 355 215 T 389 215 T 423 215 T 457 215 T 491 215 L 509 215" fill="none" stroke="#2B5E9E" stroke-width="4" stroke-linecap="round"/>
  <!-- 散射点高亮圈 -->
  <circle cx="520" cy="215" r="24" fill="#2B5E9E" fill-opacity="0.16" stroke="#2B5E9E" stroke-width="2.4" stroke-dasharray="5 4"/>

  <!-- 四面散射箭头 -->
  <g stroke="#2B5E9E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 526 196 Q 558 158 588 134"/>
    <path d="M 573 134 L 590 133 L 585 149"/>

    <path d="M 538 206 Q 608 188 668 184"/>
    <path d="M 654 176 L 670 184 L 656 194"/>

    <path d="M 538 228 Q 596 254 646 276"/>
    <path d="M 637 262 L 648 277 L 630 278"/>

    <path d="M 516 238 Q 505 316 530 392"/>
    <path d="M 517 382 L 531 394 L 536 376"/>

    <path d="M 502 200 Q 465 162 426 144"/>
    <path d="M 432 158 L 424 143 L 441 142"/>
  </g>
  <text x="255" y="176" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="20" font-weight="700" fill="#2B5E9E">蓝光（波长较短 ~450nm）</text>

  <!-- 右侧观察者与蓝天标注 -->
  <g transform="translate(765, 215)">
    <rect x="-78" y="-58" width="158" height="104" rx="6" fill="#FBF8F0" stroke="#2B5E9E" stroke-width="2.5"/>
    <text x="1" y="-22" text-anchor="middle" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="21" font-weight="700" fill="#2B5E9E">蓝光向四面散开</text>
    <text x="1" y="10" text-anchor="middle" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="18" fill="#1D1B18">抬头看到整片</text>
    <text x="1" y="36" text-anchor="middle" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="20" font-weight="700" fill="#D7372F">蓝色的天空！</text>
  </g>

  <!-- 底部地面与小观察者 -->
  <path d="M 48 486 Q 440 468 832 486" fill="none" stroke="#1D1B18" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(534, 444)" stroke="#1D1B18" stroke-width="2.6" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-16" r="10"/>
    <line x1="0" y1="-6" x2="0" y2="20"/>
    <line x1="0" y1="2" x2="-12" y2="12"/>
    <line x1="0" y1="2" x2="12" y2="-4"/>
    <line x1="0" y1="20" x2="-9" y2="36"/>
    <line x1="0" y1="20" x2="9" y2="36"/>
  </g>
  <text x="580" y="458" font-family="LXGW WenKai, Noto Serif SC, serif" font-size="18" fill="#534D44">地面抬头看</text>
</svg>
