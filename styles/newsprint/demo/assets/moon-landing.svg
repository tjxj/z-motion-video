<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 28 1200 632" width="1200" height="632">
  <defs>
    <!-- Halftone & engraving hatch patterns -->
    <pattern id="skyHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#181715"/>
      <circle cx="2" cy="2" r="0.7" fill="#2A2824"/>
      <circle cx="6" cy="6" r="0.6" fill="#252320"/>
    </pattern>
    <pattern id="shadeDark" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1A1917" stroke-width="2.4"/>
    </pattern>
    <pattern id="shadeMid" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2D2B27" stroke-width="1.6"/>
    </pattern>
    <pattern id="shadeLight" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.4" fill="#3B3832"/>
      <circle cx="7.5" cy="7.5" r="1.1" fill="#4B463E"/>
    </pattern>
    <pattern id="dotsFine" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#1A1917" opacity="0.45"/>
    </pattern>
    <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2EAD8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#181715" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7CEBC"/>
      <stop offset="42%" stop-color="#C8BEA9"/>
      <stop offset="100%" stop-color="#A99E88"/>
    </linearGradient>
  </defs>

  <!-- Deep space sky -->
  <rect width="1200" height="720" fill="url(#skyHatch)"/>

  <!-- Fine engraved horizontal sky lines for woodcut feel -->
  <g stroke="#262420" stroke-width="1" opacity="0.55">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
  </g>

  <!-- Stars -->
  <g fill="#EFE6D2">
    <circle cx="95" cy="78" r="2.2"/><circle cx="210" cy="145" r="1.6"/><circle cx="320" cy="64" r="1.9"/>
    <circle cx="445" cy="122" r="1.5"/><circle cx="570" cy="86" r="2.1"/><circle cx="690" cy="140" r="1.4"/>
    <circle cx="810" cy="72" r="1.7"/><circle cx="910" cy="195" r="1.6"/><circle cx="1095" cy="96" r="2.0"/>
    <circle cx="1140" cy="245" r="1.5"/><circle cx="148" cy="260" r="1.8"/><circle cx="285" cy="295" r="1.4"/>
    <circle cx="758" cy="272" r="1.6"/><circle cx="1050" cy="312" r="1.8"/>
    <!-- 4-point star sparkles -->
    <path d="M180 96 L183 105 L192 108 L183 111 L180 120 L177 111 L168 108 L177 105 Z"/>
    <path d="M760 105 L762 111 L768 113 L762 115 L760 121 L758 115 L752 113 L758 111 Z"/>
  </g>

  <!-- Crescent Earth in lunar sky -->
  <circle cx="970" cy="148" r="115" fill="url(#earthGlow)"/>
  <g transform="translate(970,148)">
    <circle r="56" fill="#23211E" stroke="#E5DCC7" stroke-width="2.5"/>
    <!-- Lit crescent -->
    <path d="M-12,-54.7 A56,56 0 1,0 -12,54.7 A44,56 0 1,1 -12,-54.7 Z" fill="#EFE6D2"/>
    <!-- Cloud/continent engraving streaks -->
    <path d="M-46,-14 Q-32,-20 -20,-10 M-50,12 Q-34,6 -22,18 M-38,32 Q-26,28 -18,34" fill="none" stroke="#36322B" stroke-width="3" stroke-linecap="round"/>
    <circle r="56" fill="url(#dotsFine)" opacity="0.4"/>
  </g>

  <!-- Distant lunar mountain ridges -->
  <path d="M0 448 L95 426 L195 442 L310 412 L430 434 L540 422 L680 438 L825 408 L945 430 L1085 415 L1200 436 L1200 480 L0 480 Z"
        fill="#756E61" stroke="#1A1917" stroke-width="2"/>
  <path d="M0 448 L95 426 L195 442 L310 412 L430 434 L540 422 L680 438 L825 408 L945 430 L1085 415 L1200 436 L1200 470 L0 470 Z"
        fill="url(#shadeMid)" opacity="0.55"/>

  <!-- Sea of Tranquility ground -->
  <path d="M0 462 Q300 446 600 458 T1200 454 L1200 720 L0 720 Z" fill="url(#moonGround)" stroke="#1A1917" stroke-width="3"/>

  <!-- Horizon stipple & surface shading -->
  <path d="M0 462 Q300 446 600 458 T1200 454 L1200 540 L0 540 Z" fill="url(#shadeLight)" opacity="0.35"/>

  <!-- Lunar craters -->
  <g stroke="#1A1917" stroke-width="2.2">
    <!-- Left foreground crater -->
    <ellipse cx="165" cy="625" rx="115" ry="30" fill="#B6AC97"/>
    <path d="M62 622 A110,27 0 0,1 268 622 A110,20 0 0,0 62 622 Z" fill="#2A2824"/>
    <ellipse cx="165" cy="625" rx="115" ry="30" fill="url(#shadeMid)" opacity="0.35"/>
    <!-- Mid-right crater -->
    <ellipse cx="1015" cy="592" rx="92" ry="22" fill="#BDB39E"/>
    <path d="M934 590 A84,19 0 0,1 1096 590 A84,14 0 0,0 934 590 Z" fill="#2A2824"/>
    <!-- Small distant craters -->
    <ellipse cx="810" cy="492" rx="46" ry="10" fill="#A69C88"/>
    <ellipse cx="120" cy="498" rx="54" ry="11" fill="#A69C88"/>
    <ellipse cx="470" cy="668" rx="68" ry="16" fill="#A99E88"/>
    <path d="M412 666 A58,13 0 0,1 528 666 A58,9 0 0,0 412 666 Z" fill="#2A2824"/>
  </g>

  <!-- Long dramatic lunar shadows cast to the left -->
  <polygon points="355,542 120,578 245,606 595,556 540,536" fill="#1A1917" opacity="0.62"/>
  <polygon points="782,576 620,602 652,616 808,588" fill="#1A1917" opacity="0.65"/>

  <!-- APOLLO 11 LUNAR MODULE "EAGLE" (center-left) -->
  <g transform="translate(468, 355)" stroke="#1A1917" stroke-linejoin="round" stroke-linecap="round">
    <!-- Back legs -->
    <line x1="-66" y1="88" x2="-108" y2="184" stroke-width="5"/>
    <line x1="66" y1="88" x2="108" y2="184" stroke-width="5"/>
    <ellipse cx="-112" cy="188" rx="22" ry="7" fill="#595348" stroke-width="3"/>
    <ellipse cx="112" cy="188" rx="22" ry="7" fill="#595348" stroke-width="3"/>

    <!-- Descent engine bell -->
    <path d="M-24,108 L-34,148 L34,148 L24,108 Z" fill="#2D2B27" stroke-width="3"/>
    <ellipse cx="0" cy="148" rx="34" ry="8" fill="#1A1917"/>

    <!-- Descent stage (octagonal foil body) -->
    <polygon points="-98,46 98,46 112,102 -112,102" fill="#D5CCB6" stroke-width="3.5"/>
    <!-- Side facets & foil texture -->
    <polygon points="-98,46 -56,46 -64,102 -112,102" fill="#9D9482" stroke-width="2.5"/>
    <polygon points="56,46 98,46 112,102 64,102" fill="#EFE6D2" stroke-width="2.5"/>
    <polygon points="-98,46 -56,46 -64,102 -112,102" fill="url(#shadeDark)" opacity="0.45"/>
    <polygon points="-56,46 56,46 64,102 -64,102" fill="url(#shadeLight)" opacity="0.35"/>
    <!-- Foil crinkle lines -->
    <path d="M-42,58 L-15,72 L-30,94 M12,56 L36,78 L18,95 M-12,52 L8,66 L-4,96" fill="none" stroke="#2D2B27" stroke-width="1.6"/>
    <!-- Top rim of descent stage -->
    <rect x="-102" y="38" width="204" height="10" fill="#423E37" stroke-width="2.5"/>

    <!-- Ascent stage (crew cabin) -->
    <path d="M-76,38 L-86,-22 L-54,-82 L54,-82 L86,-22 L76,38 Z" fill="#E8DFCA" stroke-width="3.5"/>
    <!-- Left shadowed facet of ascent stage -->
    <path d="M-76,38 L-86,-22 L-54,-82 L-22,-82 L-34,-22 L-28,38 Z" fill="#9E9584" stroke-width="2.5"/>
    <path d="M-76,38 L-86,-22 L-54,-82 L-22,-82 L-34,-22 L-28,38 Z" fill="url(#shadeMid)" opacity="0.5"/>
    <!-- Front face plate -->
    <polygon points="-34,-22 34,-22 28,38 -28,38" fill="#EFE6D2" stroke-width="2.5"/>
    <!-- Triangular cockpit windows -->
    <polygon points="-38,-56 -12,-56 -16,-32 -44,-36" fill="#181715" stroke-width="2.5"/>
    <polygon points="38,-56 12,-56 16,-32 44,-36" fill="#181715" stroke-width="2.5"/>
    <!-- Forward hatch -->
    <rect x="-20" y="-10" width="40" height="40" fill="#2A2824" stroke-width="2.5"/>
    <rect x="-14" y="-4" width="28" height="28" fill="#D5CCB6" stroke-width="1.8"/>
    <!-- Side RCS thruster quads -->
    <g fill="#2A2824" stroke-width="2">
      <rect x="-98" y="-34" width="14" height="20"/>
      <rect x="84" y="-34" width="14" height="20"/>
      <polygon points="-98,-34 -108,-40 -108,-28"/>
      <polygon points="98,-34 108,-40 108,-28"/>
    </g>
    <!-- Top docking ring & radar dish -->
    <rect x="-26" y="-94" width="52" height="12" fill="#423E37" stroke-width="2.5"/>
    <line x1="0" y1="-94" x2="0" y2="-136" stroke-width="3"/>
    <path d="M-24,-128 Q0,-108 24,-128" fill="none" stroke="#EFE6D2" stroke-width="4.5"/>
    <path d="M-24,-128 Q0,-108 24,-128" fill="none" stroke="#1A1917" stroke-width="2"/>
    <line x1="36" y1="-82" x2="54" y2="-122" stroke-width="2.5"/>
    <circle cx="56" cy="-126" r="5" fill="#EFE6D2" stroke-width="2"/>

    <!-- Front & side landing struts -->
    <g stroke="#1A1917" stroke-width="5.5">
      <!-- Left strut -->
      <line x1="-102" y1="68" x2="-176" y2="194"/>
      <line x1="-98" y1="102" x2="-148" y2="148" stroke-width="3.5"/>
      <line x1="-102" y1="68" x2="-142" y2="140" stroke-width="3"/>
      <!-- Right strut -->
      <line x1="102" y1="68" x2="176" y2="194"/>
      <line x1="98" y1="102" x2="148" y2="148" stroke-width="3.5"/>
      <!-- Front center strut with ladder -->
      <line x1="0" y1="98" x2="0" y2="210" stroke-width="6"/>
      <line x1="-22" y1="102" x2="0" y2="165" stroke-width="3.5"/>
      <line x1="22" y1="102" x2="0" y2="165" stroke-width="3.5"/>
    </g>
    <!-- Ladder rungs on front strut -->
    <g stroke="#EFE6D2" stroke-width="2.5">
      <line x1="-10" y1="115" x2="10" y2="115"/>
      <line x1="-10" y1="130" x2="10" y2="130"/>
      <line x1="-10" y1="145" x2="10" y2="145"/>
      <line x1="-10" y1="160" x2="10" y2="160"/>
      <line x1="-10" y1="175" x2="10" y2="175"/>
      <line x1="-10" y1="190" x2="10" y2="190"/>
    </g>
    <!-- Landing footpads -->
    <ellipse cx="-178" cy="198" rx="30" ry="9" fill="#D5CCB6" stroke-width="3"/>
    <ellipse cx="178" cy="198" rx="30" ry="9" fill="#EFE6D2" stroke-width="3"/>
    <ellipse cx="0" cy="214" rx="32" ry="10" fill="#E6DEC9" stroke-width="3"/>
  </g>

  <!-- Astronaut on the Sea of Tranquility (right of Eagle) -->
  <g transform="translate(792, 512)" stroke="#1A1917" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- PLSS Backpack -->
    <rect x="-28" y="-56" width="24" height="50" rx="3" fill="#B5AB96"/>
    <!-- Legs -->
    <path d="M-12,-4 L-20,56 L-3,58 L4,4" fill="#E8DFCA"/>
    <path d="M4,4 L18,56 L34,52 L18,-4" fill="#EFE6D2"/>
    <!-- Boots -->
    <rect x="-25" y="54" width="26" height="11" rx="2" fill="#423E37"/>
    <rect x="13" y="52" width="27" height="11" rx="2" fill="#423E37"/>
    <!-- Torso -->
    <rect x="-15" y="-52" width="34" height="52" rx="7" fill="#EFE6D2"/>
    <rect x="-7" y="-38" width="18" height="14" fill="#B5AB96" stroke-width="2"/>
    <!-- Arms -->
    <path d="M-14,-44 L-32,-16 L-22,-10 L-6,-32" fill="#D5CCB6"/>
    <path d="M18,-44 L44,-34 L42,-22 L16,-30" fill="#EFE6D2"/>
    <!-- Helmet -->
    <circle cx="3" cy="-70" r="20" fill="#EFE6D2"/>
    <!-- Dark gold visor -->
    <path d="M3,-83 A15,15 0 0,1 18,-68 A14,14 0 0,1 3,-56 Z" fill="#181715"/>
    <path d="M9,-76 L14,-72" stroke="#EFE6D2" stroke-width="2"/>
  </g>

  <!-- Flag / Scientific Pole beside astronaut -->
  <g transform="translate(866, 444)" stroke="#1A1917" stroke-width="3">
    <line x1="0" y1="0" x2="0" y2="140"/>
    <line x1="0" y1="4" x2="78" y2="4"/>
    <path d="M0,4 L76,4 Q72,22 76,42 L0,42 Z" fill="#EFE6D2" stroke-width="2.5"/>
    <!-- Stripes in newsprint monochrome -->
    <line x1="28" y1="12" x2="74" y2="12" stroke-width="2"/>
    <line x1="28" y1="20" x2="74" y2="20" stroke-width="2"/>
    <line x1="0" y1="28" x2="75" y2="28" stroke-width="2"/>
    <line x1="0" y1="36" x2="75" y2="36" stroke-width="2"/>
    <rect x="0" y="4" width="28" height="20" fill="#1A1917"/>
  </g>

  <!-- Footprint trail leading from ladder to astronaut -->
  <g fill="#2A2824" opacity="0.72">
    <ellipse cx="520" cy="596" rx="10" ry="4" transform="rotate(6 520 596)"/>
    <ellipse cx="566" cy="606" rx="10" ry="4" transform="rotate(-4 566 606)"/>
    <ellipse cx="614" cy="598" rx="10" ry="4" transform="rotate(5 614 598)"/>
    <ellipse cx="662" cy="608" rx="10" ry="4" transform="rotate(-3 662 608)"/>
    <ellipse cx="712" cy="596" rx="10" ry="4" transform="rotate(4 712 596)"/>
  </g>

  <!-- Subtle engraving border inside SVG -->
  <rect x="10" y="38" width="1180" height="612" fill="none" stroke="#1A1917" stroke-width="3"/>
</svg>
