<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" fill="none">
  <!-- Floor Pump Base -->
  <rect x="44" y="102" width="66" height="12" rx="3" fill="#111111"/>
  <!-- Pump Cylinder -->
  <rect x="68" y="34" width="18" height="68" fill="#FBFBF8" stroke="#111111" stroke-width="4"/>
  <!-- Piston Rod -->
  <line x1="77" y1="18" x2="77" y2="34" stroke="#111111" stroke-width="4"/>
  <!-- T-Handle -->
  <rect x="48" y="12" width="58" height="10" rx="5" fill="#FF5B1F" stroke="#111111" stroke-width="3.5"/>
  <!-- Pressure Gauge -->
  <circle cx="104" cy="84" r="14" fill="#FBFBF8" stroke="#111111" stroke-width="3.5"/>
  <line x1="104" y1="84" x2="112" y2="77" stroke="#FF5B1F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="104" cy="84" r="2.5" fill="#111111"/>
  <!-- Flexible Hose -->
  <path d="M86 96 C126 96 144 88 144 62 C144 42 134 32 148 26" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Valve Chuck -->
  <rect x="144" y="18" width="18" height="12" rx="2" fill="#FF5B1F" stroke="#111111" stroke-width="3"/>
</svg>
