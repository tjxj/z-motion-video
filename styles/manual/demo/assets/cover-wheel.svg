<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none">
  <!-- Technical crosshairs & dimension lines -->
  <g stroke="#111111" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="250" y1="22" x2="250" y2="418"/>
    <line x1="48" y1="220" x2="462" y2="220"/>
  </g>
  <!-- Dimension callout bottom -->
  <g stroke="#111111" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="406" x2="420" y2="406"/>
    <line x1="80" y1="396" x2="80" y2="416"/>
    <line x1="420" y1="396" x2="420" y2="416"/>
    <path d="M92 401 L80 406 L92 411"/>
    <path d="M408 401 L420 406 L408 411"/>
  </g>
  <rect x="212" y="394" width="76" height="24" fill="#FBFBF8"/>
  <text x="250" y="411" text-anchor="middle" font-family="monospace" font-weight="700" font-size="15" fill="#111111">Ø WHEEL</text>

  <!-- Bicycle Wheel (Centered at 250, 220) -->
  <!-- Outer Tire -->
  <circle cx="250" cy="220" r="168" fill="#FBFBF8" stroke="#111111" stroke-width="6"/>
  <!-- Tire tread ticks -->
  <circle cx="250" cy="220" r="160" stroke="#111111" stroke-width="2" stroke-dasharray="3 13"/>
  <!-- Inner Tire Wall / Rim Outer -->
  <circle cx="250" cy="220" r="142" fill="#FBFBF8" stroke="#111111" stroke-width="4"/>
  <!-- Rim Inner -->
  <circle cx="250" cy="220" r="128" fill="#FBFBF8" stroke="#111111" stroke-width="3"/>

  <!-- 16 Radial Spokes -->
  <g stroke="#111111" stroke-width="2" stroke-linecap="round">
    <line x1="250" y1="92" x2="250" y2="348"/>
    <line x1="122" y1="220" x2="378" y2="220"/>
    <line x1="159.5" y1="129.5" x2="340.5" y2="310.5"/>
    <line x1="340.5" y1="129.5" x2="159.5" y2="310.5"/>
    <line x1="201" y1="101.7" x2="299" y2="338.3"/>
    <line x1="299" y1="101.7" x2="201" y2="338.3"/>
    <line x1="131.7" y1="171" x2="368.3" y2="269"/>
    <line x1="368.3" y1="171" x2="131.7" y2="269"/>
  </g>

  <!-- Valve Stem at bottom -->
  <rect x="245" y="316" width="10" height="32" rx="2" fill="#FBFBF8" stroke="#111111" stroke-width="3"/>
  <line x1="243" y1="322" x2="257" y2="322" stroke="#111111" stroke-width="2.5"/>

  <!-- Hub & Axle -->
  <circle cx="250" cy="220" r="28" fill="#FBFBF8" stroke="#111111" stroke-width="4"/>
  <circle cx="250" cy="220" r="16" fill="#FBFBF8" stroke="#111111" stroke-width="2.5"/>
  <circle cx="250" cy="220" r="6" fill="#111111"/>

  <!-- Safety Orange Puncture Callout on Upper-Right Rim -->
  <circle cx="378" cy="126" r="18" fill="#FF5B1F" fill-opacity="0.18" stroke="#FF5B1F" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="378" cy="126" r="5" fill="#FF5B1F"/>

  <!-- Tire Lever Engaging Tire Bead (Right Side) -->
  <g transform="translate(382, 134) rotate(-22)">
    <path d="M-8 0 C0 -8 14 -8 24 -4 L96 -4 C106 -4 112 2 112 10 C112 18 106 24 96 24 L20 24 C10 24 2 18 -6 12 Z" fill="#FBFBF8" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-8 0 L18 -2 L14 14 L-6 12 Z" fill="#FF5B1F" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="94" cy="10" r="5" fill="#FBFBF8" stroke="#111111" stroke-width="2.5"/>
    <line x1="34" y1="10" x2="78" y2="10" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Curved Safety-Orange Motion Arc -->
  <path d="M466 84 A 118 118 0 0 1 494 218" stroke="#FF5B1F" stroke-width="4.5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <path d="M482 204 L494 222 L508 206" stroke="#FF5B1F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mini Circular Loupe Callout (Top-Right) -->
  <line x1="396" y1="118" x2="486" y2="96" stroke="#111111" stroke-width="2.5" stroke-dasharray="5 5"/>
  <g transform="translate(546, 92)">
    <circle cx="0" cy="0" r="56" fill="#FBFBF8" stroke="#111111" stroke-width="4.5"/>
    <!-- Zoomed Patch + Pinhole -->
    <path d="M-42 14 Q0 -4 42 14" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M-42 28 Q0 10 42 28" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-20" y="-22" width="40" height="26" rx="4" fill="#FF5B1F" stroke="#111111" stroke-width="3"/>
    <rect x="-11" y="-15" width="22" height="12" rx="2" fill="#FBFBF8" stroke="#111111" stroke-width="2"/>
    <path d="M0 -34 L0 -26" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    <path d="M-6 -30 L0 -24 L6 -30" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="494" y="156" width="104" height="24" rx="2" fill="#111111"/>
  <text x="546" y="173" text-anchor="middle" font-family="monospace" font-weight="700" font-size="13" fill="#FBFBF8">DETAIL · 2X</text>

  <!-- Secondary Mini Exploded Part Callout (Bottom-Right) -->
  <g transform="translate(476, 286)">
    <rect x="0" y="0" width="128" height="92" rx="3" fill="#FBFBF8" stroke="#111111" stroke-width="3"/>
    <rect x="0" y="0" width="128" height="24" fill="#111111"/>
    <text x="64" y="16" text-anchor="middle" font-family="monospace" font-weight="700" font-size="12" fill="#FBFBF8">STEP 01—06</text>
    <!-- Mini Pump + Patch icons -->
    <line x1="26" y1="42" x2="26" y2="76" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16" y1="42" x2="36" y2="42" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16" y1="76" x2="36" y2="76" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M48 58 L66 58" stroke="#FF5B1F" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 52 L67 58 L60 64" stroke="#FF5B1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="78" y="44" width="32" height="28" rx="4" fill="#FF5B1F" fill-opacity="0.2" stroke="#111111" stroke-width="3"/>
    <path d="M87 58 L93 64 L103 52" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
