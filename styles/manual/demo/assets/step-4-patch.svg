<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" fill="none">
  <!-- Flat Inner Tube Band -->
  <rect x="34" y="130" width="372" height="54" rx="12" fill="#FBFBF8" stroke="#111111" stroke-width="4.5"/>
  <line x1="46" y1="157" x2="394" y2="157" stroke="#111111" stroke-width="2" stroke-dasharray="10 8" stroke-opacity="0.4"/>

  <!-- Buffed Rough Zone (Hatching) -->
  <rect x="164" y="138" width="112" height="38" rx="6" fill="#EFECE4" stroke="#111111" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="220" cy="157" r="4.5" fill="#FF5B1F"/>

  <!-- Left Action: Sandpaper Buffing Back & Forth -->
  <g transform="translate(64, 34) rotate(-12)">
    <rect x="0" y="0" width="66" height="44" rx="4" fill="#FBFBF8" stroke="#111111" stroke-width="3.5"/>
    <circle cx="16" cy="14" r="2.2" fill="#111111"/><circle cx="32" cy="14" r="2.2" fill="#111111"/><circle cx="48" cy="14" r="2.2" fill="#111111"/>
    <circle cx="24" cy="28" r="2.2" fill="#111111"/><circle cx="40" cy="28" r="2.2" fill="#111111"/><circle cx="54" cy="28" r="2.2" fill="#111111"/>
  </g>
  <!-- Horizontal Back-and-Forth Arrow -->
  <path d="M62 96 L130 96" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M72 89 L60 96 L72 103 M120 89 L132 96 L120 103" stroke="#111111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Action: Patch Descending onto Buffed Spot -->
  <g transform="translate(182, 26)">
    <rect x="0" y="0" width="76" height="44" rx="6" fill="#FF5B1F" stroke="#111111" stroke-width="4"/>
    <rect x="14" y="10" width="48" height="24" rx="3" fill="#FBFBF8" stroke="#111111" stroke-width="2.5"/>
  </g>
  <!-- Downward Press Arrows -->
  <line x1="220" y1="80" x2="220" y2="120" stroke="#FF5B1F" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M209 109 L220 122 L231 109" stroke="#FF5B1F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Action: Clock / Wait Dry Indicator -->
  <g transform="translate(342, 60)">
    <circle cx="0" cy="0" r="32" fill="#FBFBF8" stroke="#111111" stroke-width="4"/>
    <line x1="0" y1="-22" x2="0" y2="0" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="10" stroke="#FF5B1F" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#111111"/>
  </g>
</svg>
