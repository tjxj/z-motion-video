<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#F2F0EB"/>

  <!-- Top Swiss header line -->
  <line x1="40" y1="52" x2="1160" y2="52" stroke="#111111" stroke-width="3"/>
  <rect x="40" y="22" width="14" height="14" fill="#E4002B"/>
  <text x="66" y="35" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#111111" letter-spacing="1.5">FIG. 01 // AREA SCALE</text>
  <text x="1160" y="35" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#7D7C76" letter-spacing="1">USGS WATER DATA</text>

  <!-- LEFT BLOCK: 100% Earth's Water (480x480 square = 10x10 cells of 48px) -->
  <g transform="translate(40, 96)">
    <text x="0" y="-16" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#111111">01 · TOTAL WATER = 100%</text>
    <!-- 97.5% Saline fill -->
    <rect x="0" y="0" width="480" height="480" fill="#6E8CA0"/>
    <!-- 10x10 grid hairlines -->
    <g stroke="#F2F0EB" stroke-width="2" opacity="0.65">
      <line x1="48" y1="0" x2="48" y2="480"/><line x1="96" y1="0" x2="96" y2="480"/>
      <line x1="144" y1="0" x2="144" y2="480"/><line x1="192" y1="0" x2="192" y2="480"/>
      <line x1="240" y1="0" x2="240" y2="480"/><line x1="288" y1="0" x2="288" y2="480"/>
      <line x1="336" y1="0" x2="336" y2="480"/><line x1="384" y1="0" x2="384" y2="480"/>
      <line x1="432" y1="0" x2="432" y2="480"/>
      <line x1="0" y1="48" x2="480" y2="48"/><line x1="0" y1="96" x2="480" y2="96"/>
      <line x1="0" y1="144" x2="480" y2="144"/><line x1="0" y1="192" x2="480" y2="192"/>
      <line x1="0" y1="240" x2="480" y2="240"/><line x1="0" y1="288" x2="480" y2="288"/>
      <line x1="0" y1="336" x2="480" y2="336"/><line x1="0" y1="384" x2="480" y2="384"/>
      <line x1="0" y1="432" x2="480" y2="432"/>
    </g>
    <!-- 2.5% Freshwater block: 2.5 cells at bottom-right (120px x 48px) -->
    <rect x="360" y="432" width="120" height="48" fill="#E4002B"/>
    <line x1="384" y1="432" x2="384" y2="480" stroke="#F2F0EB" stroke-width="2" opacity="0.65"/>
    <line x1="432" y1="432" x2="432" y2="480" stroke="#F2F0EB" stroke-width="2" opacity="0.65"/>
    <!-- Sharp outer border -->
    <rect x="0" y="0" width="480" height="480" fill="none" stroke="#111111" stroke-width="3"/>
    <!-- Big typographic figure inside saline block -->
    <text x="26" y="100" font-family="Helvetica Neue, Arial, sans-serif" font-size="80" font-weight="900" fill="#F2F0EB" letter-spacing="-3">97.5%</text>
    <text x="28" y="142" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#F2F0EB">咸水（主要为海洋）</text>
    <!-- Bottom label for 2.5% -->
    <text x="480" y="516" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="900" fill="#E4002B">2.5% FRESHWATER</text>
  </g>

  <!-- CONNECTOR LINES: Expanding the 2.5% red block to the right column -->
  <g stroke="#E4002B" stroke-width="2.5" fill="none">
    <line x1="520" y1="528" x2="660" y2="96" stroke-dasharray="6 5"/>
    <line x1="520" y1="576" x2="660" y2="576"/>
  </g>
  <!-- Zoom badge -->
  <rect x="546" y="330" width="90" height="34" fill="#E4002B"/>
  <text x="591" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#FFFFFF">40x ZOOM</text>

  <!-- RIGHT BLOCK: 100% of Freshwater (240x480 column, exact heights: 68.7%=329.8px, 30.1%=144.5px, 1.2%=5.7px) -->
  <g transform="translate(660, 96)">
    <text x="0" y="-16" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#E4002B">02 · FRESHWATER BREAKDOWN</text>

    <!-- Glaciers & Ice Caps: 68.7% = 329.8px -->
    <rect x="0" y="0" width="236" height="329.8" fill="#111111"/>
    <text x="22" y="74" font-family="Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="900" fill="#F2F0EB" letter-spacing="-2">68.7%</text>
    <text x="22" y="112" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#F2F0EB">冰川和冰盖</text>
    <line x1="22" y1="302" x2="214" y2="302" stroke="#F2F0EB" stroke-width="1.5" opacity="0.35"/>
    <text x="22" y="288" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F2F0EB" opacity="0.65">ICE / SOLID STATE</text>

    <!-- Groundwater: 30.1% = 144.5px (y = 329.8 to 474.3) -->
    <rect x="0" y="329.8" width="236" height="144.5" fill="#6E8CA0"/>
    <text x="22" y="394" font-family="Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">30.1%</text>
    <text x="22" y="430" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">地下水</text>

    <!-- Surface & Other: 1.2% = 5.7px (y = 474.3 to 480) -->
    <rect x="0" y="474.3" width="236" height="5.7" fill="#E4002B"/>

    <!-- Sharp frame & divider lines -->
    <line x1="0" y1="329.8" x2="236" y2="329.8" stroke="#F2F0EB" stroke-width="2.5"/>
    <line x1="0" y1="474.3" x2="236" y2="474.3" stroke="#F2F0EB" stroke-width="1.5"/>
    <rect x="0" y="0" width="236" height="480" fill="none" stroke="#111111" stroke-width="3"/>

    <!-- Callouts on the right of the column -->
    <line x1="236" y1="60" x2="270" y2="60" stroke="#111111" stroke-width="2"/>
    <text x="282" y="56" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700" fill="#7D7C76">LOCKED IN ICE</text>
    <text x="282" y="84" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#111111">主要在南极与格陵兰</text>

    <line x1="236" y1="402" x2="270" y2="402" stroke="#6E8CA0" stroke-width="2"/>
    <text x="282" y="396" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700" fill="#6E8CA0">SUBSURFACE</text>
    <text x="282" y="424" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#111111">深埋地下含水层</text>

    <!-- Surface 1.2% dramatic callout -->
    <polyline points="236,477 270,477 270,504 282,504" fill="none" stroke="#E4002B" stroke-width="3"/>
    <rect x="282" y="478" width="218" height="52" fill="#E4002B"/>
    <text x="296" y="512" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">1.2%</text>
    <text x="374" y="511" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">地表与其他</text>
  </g>

  <!-- Bottom rule -->
  <line x1="40" y1="664" x2="1160" y2="664" stroke="#111111" stroke-width="1.5"/>
  <text x="40" y="688" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#7D7C76">PROPORTIONAL AREA DIAGRAM · NOT TO LINEAR HEIGHT</text>
  <text x="1160" y="688" text-anchor="end" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#4A4A46">数据：美国地质调查局</text>
</svg>
